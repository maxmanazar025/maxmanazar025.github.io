  <script>
    (() => {
      const el = document.querySelector(".typer"), lines = el.dataset.lines.split("|");
      let li = 0, ci = 0, del = false;
      (function type() {
        const w = lines[li]; el.textContent = w.slice(0, ci);
        if (!del && ci < w.length) ci++; else if (del && ci > 0) ci--;
        else if (!del) { del = true; return setTimeout(type, 1800); } else { del = false; li = (li + 1) % lines.length; }
        setTimeout(type, del ? 26 : 55);
      })();
    })();
